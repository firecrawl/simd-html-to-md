name: CI

on:
  push:
    branches: [main, "abi/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Tests
        run: cargo test

      - name: Doc tests
        run: cargo test --doc

  # Verify rust-output.md files are up to date (catch quality drift)
  output-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate outputs
        run: cargo run --example generate_rust_output

      - name: Check for drift
        run: |
          if ! git diff --quiet testdata/; then
            echo "::error::rust-output.md files are out of date. Run 'cargo +nightly run --example generate_rust_output' and commit."
            git diff --stat testdata/
            git diff testdata/
            exit 1
          fi
          echo "All outputs up to date."

  # Track word coverage vs Go output across test cases
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate outputs
        run: cargo run --example generate_rust_output

      - name: Compare word coverage vs Go
        run: |
          total_go_words=0
          total_missing=0
          total_go_bytes=0
          total_rust_bytes=0
          failures=""

          # Tests where we intentionally differ from Go (strip noscript/iframe/etc)
          SKIP_QUALITY="keep_remove_tag"

          # Extract content words: only alphabetic 3+ chars (skip URLs, numbers, encoded junk)
          extract_words() {
            tr -cs 'A-Za-z' '\n' | tr '[:upper:]' '[:lower:]' | awk 'length >= 3' | sort -u
          }

          for go_file in $(find testdata -name "go-output.md"); do
            dir=$(dirname "$go_file")
            rust_file="$dir/rust-output.md"
            [ -f "$rust_file" ] || continue

            test_name=${dir#testdata/}

            # Skip intentionally divergent tests
            skip=false
            for s in $SKIP_QUALITY; do
              case "$test_name" in *"$s"*) skip=true ;; esac
            done
            if $skip; then
              echo "SKIP  $test_name (intentional divergence)"
              continue
            fi

            go_bytes=$(wc -c < "$go_file")
            rust_bytes=$(wc -c < "$rust_file")
            total_go_bytes=$((total_go_bytes + go_bytes))
            total_rust_bytes=$((total_rust_bytes + rust_bytes))

            go_words=$(extract_words < "$go_file" | grep -c '.' || true)
            missing=$(comm -23 \
              <(extract_words < "$go_file") \
              <(extract_words < "$rust_file") | grep -c '.' || true)

            total_go_words=$((total_go_words + go_words))
            total_missing=$((total_missing + missing))

            if [ "$missing" -gt 0 ]; then
              coverage=$(echo "scale=3; 1 - $missing / $go_words" | bc)
              missing_sample=$(comm -23 \
                <(extract_words < "$go_file") \
                <(extract_words < "$rust_file") | head -5 | tr '\n' ' ')
              echo "::warning::$test_name: word coverage $coverage ($missing/$go_words missing: $missing_sample)"

              # Fail if any test drops below 80% word coverage
              threshold=$(echo "$missing * 5 > $go_words" | bc)
              if [ "$threshold" -eq 1 ]; then
                failures="$failures $test_name"
              fi
            fi
          done

          overall=$(echo "scale=4; 1 - $total_missing / $total_go_words" | bc)
          savings=$((total_go_bytes - total_rust_bytes))
          echo ""
          echo "=== Quality Summary ==="
          echo "Overall word coverage: $overall ($total_missing/$total_go_words words missing)"
          echo "Total Go bytes: $total_go_bytes"
          echo "Total Rust bytes: $total_rust_bytes"
          echo "Token savings: $savings bytes ($(echo "scale=1; $savings * 100 / $total_go_bytes" | bc)%)"

          if [ -n "$failures" ]; then
            echo "::error::Word coverage below 80% for:$failures"
            exit 1
          fi

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench 2>&1 | tee bench-output.txt

      - name: Print results
        if: always()
        run: |
          echo "=== Benchmark Results ==="
          grep "time:" bench-output.txt || echo "No timing results found"
